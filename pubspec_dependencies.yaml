# ─────────────────────────────────────────────────────────────────────────────
# BarakahHub — pubspec.yaml (Member 2 relevant section)
# Add these under your existing dependencies: block
# ─────────────────────────────────────────────────────────────────────────────

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.4

  # Image loading
  cached_network_image: ^3.4.1

  # Date formatting  (used in EventCard, EventDetailsScreen, MyRegisteredEventsScreen)
  intl: ^0.19.0

  # Image picker (for event banners — organizer side)
  image_picker: ^1.1.2


# ─────────────────────────────────────────────────────────────────────────────
# Run after adding dependencies:
#   flutter pub get
# ─────────────────────────────────────────────────────────────────────────────
